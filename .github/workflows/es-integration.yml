name: es-integration

# Opt-in Elasticsearch value-retrieval tier. Runs ONLY when the PR carries the `es-integration`
# label. `types: [..., synchronize, labeled]` means: adding the label runs it, and every new
# commit while the label is present re-runs it (not just the first labeling). Also manual.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: es-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  es-integration:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'es-integration')
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,es]"
      - name: Run the Elasticsearch integration tier (must not be all-skipped)
        env:
          CADENCE_ES_URL: http://localhost:9200
        run: |
          pytest -q -m es_integration -o addopts= --no-header -ra \
            | tee es_out.txt
          # fail if every es_integration test was skipped (the tier must actually run)
          grep -Eq "[0-9]+ passed" es_out.txt || { echo "no es_integration tests ran"; exit 1; }
