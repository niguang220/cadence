[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence"
version = "0.1.0"
description = "A planner-driven SaaS-metrics data agent with a built-in evaluation & reliability harness."
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-deepseek",
    "sqlglot",
    "python-dotenv",
    "fastembed",
    "numpy",
    "rank-bm25",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
demo = [
    "streamlit",
]
es = [
    "elasticsearch>=8,<9",
]

[project.scripts]
cadence = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*", "evalharness*"]

[tool.pytest.ini_options]
markers = [
    "es_integration: real Elasticsearch integration test (opt-in; needs CADENCE_ES_URL + the es extra). Skipped by default; run via the es-integration CI job or a local Docker ES.",
]
