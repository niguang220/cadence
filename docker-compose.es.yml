# Opt-in single-node Elasticsearch for the value-retrieval integration tier. NOT part of the
# default install or default CI. Local use:
#   docker compose -f docker-compose.es.yml up -d
#   CADENCE_ES_URL=http://localhost:9200 pytest -q -m es_integration
#   docker compose -f docker-compose.es.yml down
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
